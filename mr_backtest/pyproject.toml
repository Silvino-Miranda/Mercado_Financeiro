[project]
name = "mr-backtest"
version = "0.1.0"
description = "Mean-Reversion Backtester for BTCUSDT with Grid Search optimization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "numpy>=2.2.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]
