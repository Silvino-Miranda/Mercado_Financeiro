[project]
name = "rn-operar-cripto"
version = "0.1.0"
description = "Sistema de trading de criptomoedas usando Redes Neurais"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "absl-py",
    "astunparse",
    "backtrader",
    "beautifulsoup4",
    "certifi",
    "charset-normalizer",
    "contourpy",
    "cycler",
    "flatbuffers",
    "fonttools",
    "frozendict",
    "gast",
    "google-pasta",
    "graphviz",
    "grpcio",
    "h5py",
    "html5lib",
    "idna",
    "joblib",
    "keras",
    "kiwisolver",
    "libclang",
    "lxml",
    "Markdown",
    "markdown-it-py",
    "MarkupSafe",
    "matplotlib",
    "mdurl",
    "ml-dtypes",
    "multitasking",
    "namex",
    "numpy",
    "opt_einsum",
    "optree",
    "packaging",
    "pandas",
    "peewee",
    "pillow",
    "platformdirs",
    "protobuf",
    "pydot",
    "Pygments",
    "pyparsing",
    "python-dateutil",
    "pytz",
    "requests",
    "rich",
    "scikit-learn",
    "scipy",
    "setuptools",
    "six",
    "soupsieve",
    "tensorboard",
    "tensorboard-data-server",
    "tensorflow",
    "tensorflow-intel",
    "termcolor",
    "threadpoolctl",
    "typing_extensions",
    "tzdata",
    "urllib3",
    "webencodings",
    "Werkzeug",
    "wheel",
    "wrapt",
    "yfinance",
    "ta",
    "dash",
    "plotly",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# Configurações do uv
dev-dependencies = []

[tool.uv.sources]
# Caso precise instalar o TA-Lib local
# ta-lib = { path = "_Arquivos/TA_Lib-0.4.32-cp312-cp312-win_amd64.whl" }
